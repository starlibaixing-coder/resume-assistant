module: 9
moduleName: 实战踩坑
questions:
  - id: "09.1"
    difficulty: 高
    tags: []
    title: 你的 Agent 突然开始反复调用同一个工具，陷入死循环，你怎么定位 + 怎么治？
    focus: "生产事故排查能力，能否分层给出治理方案（不是只会一句\"加个 max_steps\"）。"
    answer:
    - "**定位**："
    - "看 trace 日志，确认是\"规划层重复生成相同 action\"还是\"工具返回结果未被正确理解导致重复尝试\"；"
    - 检查是否状态没推进（每次循环 state 没变化）。
    - "**治理（分层）**："
    - 兜底：最大迭代次数 / 最大 token 预算硬上限；
    - "检测:维护\"近期 action 历史\",检测循环模式——**连续 N 次相同 action(A→A→A)** 或**振荡(A→B→A→B)**;对最近 K 步 action 序列做指纹(hash),窗口内子序列重复出现即判定卡死;"
    - "纠偏：注入 Reflection（\"你已重复调用 X 3 次，请换思路或终止\"）；"
    - 升级：触发人工兜底（escalation）；
    - 回流：bad case 归集补评测集。
    followups:
    - "如果是\"工具一直返回错误导致重试\"呢？（区分可重试 vs 不可重试错误，见模块 10）"
  - id: "09.2"
    difficulty: 高
    tags: []
    title: "用户问\"帮我查一下订单然后退掉\"，Agent 只查了订单没退款，为什么？怎么改？"
    focus: 多意图 / 多步任务的拆解能力。
    answer:
    - "**根因**（两类）："
    - 任务规划只生成了第一步（单轮 ReAct 无全局 plan）；
    - "system prompt 没有强制\"任务未完成不得结束\"。"
    - "**改进**："
    - "用 Plan-and-Execute 先生成完整步骤 [查单 → 确认 → 退款]，再逐步执行；"
    - "引入\"任务完成判定器\"——每步后检查目标是否全部达成；"
    - "system prompt 强约束：\"在所有用户目标完成前，必须继续执行或询问用户\"。"
    followups:
    - ""
  - id: "09.3"
    difficulty: 高
    tags: []
    title: Agent 用 function calling，模型经常传错参数（该传 int 传了 string），怎么办？
    focus: 工具调用可靠性的工程治理。
    answer:
    - "**结构化输出层(当前最有效的一层)**:"
    - "**strict mode / response_format**:OpenAI 的 strict mode、`response_format=json_schema`,provider 在解码时强制合法 JSON;"
    - "**受约束解码**:Outlines / xgrammar / llama.cpp grammar,用 schema 约束每步可选 token,可靠性最高;"
    - "**容错解析**:json-repair / partial JSON parser 处理不完整 JSON(流式/长输出场景必备)。"
    - "**工具侧**："
    - JSON Schema 定义要严格（type/format/enum/required 全给）；
    - description 写清典型用法 + 反例；
    - 给 example（few-shot 示范正确参数）。
    - "**工程侧(兜底)**："
    - "**参数校验 + 自动纠错**：校验失败 → 把错误信息喂回模型让它重试（\"参数 order_id 应为 int，你传了 '123'，请重试\"），最多 N 次;"
    - "数据校验驱动:`instructor` / pydantic 自动重试;"
    - 重试仍失败 → 降级或转人工。
    - "**模型侧**：换 function calling 支持更好的模型；适当降 temperature。"
    followups:
    - ""
  - id: "09.4"
    difficulty: 中
    tags: []
    title: 一个对话 Agent，聊到第 20 轮开始答非所问，什么原因？怎么治？
    focus: 上下文退化（context rot）的认知与治理。
    answer:
    - "**根因**：早期关键信息被挤出窗口（context rot）；或上下文过长导致模型注意力分散（\"lost in the middle\"）。"
    - "**治理**："
    - 滑动窗口 + 早期对话摘要压缩（rolling summary）；
    - 关键信息（用户画像、任务目标、约束）放进 system prompt 常驻；
    - 长期记忆外置到向量库，按需检索注入；
    - 控制单次上下文长度，必要时分段处理。
    followups:
    - ""
  - id: "09.5"
    difficulty: 高
    tags: []
    title: 线上 Agent 偶发性返回乱码 / 空结果，本地复现不了，怎么排查？
    focus: 可复现性 + 系统性 debug 能力。
    answer:
    - "**关键前提**：全链路 trace 记录每次请求的完整 prompt + response + params（temperature/top_p/seed）+ 模型版本。"
    - "**排查步骤**："
    - 先确认是否模型侧问题（限流降级、上游故障）——查 provider 状态页、错误码；
    - 排查是否并发导致状态污染（共享变量、会话串号）；
    - 排查输入差异（是否有特殊字符、编码问题、超长输入触发截断）；
    - 固定参数 replay 离线复现；
    - "**长期机制**：建失败 case 自动归集 + 离线回放管道（见模块 10）。"
    followups:
    - "如何固定 LLM 输出便于复现？（固定 seed/temperature=0，但仍非 100% 确定性，需理解原因）"
  - id: "09.6"
    difficulty: 高
    tags: [系统设计]
    title: "设计一个能跑 30 分钟的长任务 Agent（如\"分析整个代码库并出报告\"），如何保证不中途崩溃、崩了能续跑？"
    focus: 生产级长任务的核心工程能力——这是 JD4（Coding Agent）的核心场景。
    answer:
    - "**任务分解**：拆成可独立执行的子任务（DAG），每个子任务粒度可控（分钟级）。"
    - "**状态持久化**："
    - 每步 checkpoint 到外部存储（DB / 文件），不靠内存；
    - 记录每个子任务的状态（pending / running / done / failed）。
    - "**幂等 + 断点续跑**："
    - 每个子任务可安全重试（幂等设计）；
    - 重启后读取 checkpoint，跳过已完成节点，从断点继续。
    - "**资源隔离**：子任务超时、失败不影响整体；可配置重试策略。"
    - "**进度可观测**：实时进度上报、中间产物落盘（即使最终失败，部分结果也可用）。"
    - "**成本控制**：子任务可并行；预算上限保护。"
    followups:
    - 用什么数据结构管理子任务依赖？（拓扑排序 + DAG，见模块 11）
  - id: "09.7"
    difficulty: 中
    tags: []
    title: Agent 调用外部工具经常超时，导致整体延迟很高，你怎么优化？
    focus: 工具调用的性能优化。
    answer:
    - "**超时控制**：每个工具调用设硬超时，超时即失败 / 降级，不拖垮整体。"
    - "**并行化**：无依赖的工具调用并行执行（如同时查多个数据源）。"
    - "**缓存**：相同输入的工具结果缓存（注意 TTL 与失效策略）。"
    - "**降级**：工具不可用时返回兜底结果或换备用工具。"
    - "**异步化**：耗时工具改异步（先返回\"处理中\"，完成再通知）。"
    followups:
    - ""
  - id: "09.8"
    difficulty: 高
    tags: []
    title: "流式输出(streaming)有哪些坑?怎么处理?"
    focus: 流式输出的实战处理(当下超高频坑)。
    answer:
    - "**典型坑**:"
    - "**SSE 连接中断**:客户端断网/关闭后,服务端是否继续跑?需心跳检测 + 可配置策略(继续/取消);"
    - "**流式 function calling 参数分块到达**:工具调用参数被切成多个 chunk,**需缓冲拼装完整 JSON 后再解析**(不能收到一个 chunk 就解析);"
    - "**首字延迟 vs 总延迟权衡**:流式降首字时间,但总时间未必变短(生成总量不变);"
    - "**客户端断连的资源回收**:长连接对应的 LLM 推理/工具调用要能取消,避免资源泄漏;"
    - "**JSON 不完整**:流式时 JSON 还没生成完,需 partial JSON parser 或等完整再解析。"
    - "**处理**:"
    - 用标准 SSE / chunked transfer;
    - 服务端可取消(CancelToken / AbortController);
    - 工具参数缓冲 + 完整性校验后再执行;
    - "区分\"展示用流式\"和\"解析用完整结果\"。"
    followups:
    - ""
