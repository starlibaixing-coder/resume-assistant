moduleName: 算法
questions:
  - id: '02.5'
    difficulty: 初
    tags:
      - 高频
      - 手写
    title: 给定两个已排序数组，将它们合并成一个新的有序数组（或把 nums2 合并进 nums1 末尾的预留空间）。
    focus: 双指针从后往前（原地合并）或从前往后（新数组）依次比较填入，O(m+n) 时间。
    answer:
      - 经典合并：两个数组各自有序，用两个指针 i、j 分别指向开头，比较后把较小者放入结果，移动对应指针；任一数组遍历完后，把另一个数组剩余部分直接接上。
      - LeetCode 88 变种（nums1 末尾预留 m 个空位，原地合并）：从**后往前**填，避免从前向后移动元素。三个指针：i 指向 nums1 有效末尾、j 指向 nums2 末尾、k 指向 nums1 总末尾。
      - 复杂度：时间 O(m+n)，空间 O(1)（原地）。
    followups:
      - 为什么 LeetCode 88 要从后往前合并？
      - 如果要求合并 K 个有序链表/数组怎么做？
      - 能否用二分优化？
  - id: '02.6'
    difficulty: 初
    tags:
      - 高频
      - 手写
    title: 判断一个字符串（或整数）是否是回文。
    focus: 字符串：左右双指针向中间靠拢，逐字符比较。整数：转字符串同法，或反转数字后比较（注意溢出用 BigInt）。
    answer:
      - '**回文串**：首尾对称，正读反读相同。双指针 i=0、j=len-1，向中间走，任一处不等则非回文。'
    followups:
      - 最长回文子串怎么求？
      - 最长回文子序列呢？
      - 回文数字为什么不直接反转整个数字再比？
  - id: '02.7'
    difficulty: 初
    tags:
      - 高频
      - 手写
    title: 比较两个版本号 version1 和 version2（形如 `1.0.1`、`1.01`、`7.5.2.4`）。若 v1 > v2 返回 1，< 返回 -1，相等返回 0。
    focus: 按 `.` 切分成修订号数组，从左到右逐段比较（当作数字比，忽略前导零），某段短的补 0。
    answer:
      - 版本号由若干修订号用 `.` 连接。比较规则：从左到右逐段比较每个修订号的**整数值**（忽略前导零，如 `01` == `1`）。若长度不一，缺失段按 0 处理。
      - 步骤：
      - 1. 用 split('.') 切分两个版本。
      - 2. 取两者较长长度作为循环次数。
      - 3. 每段用 Number() 转数字（自动去前导零），比较大小。
      - 4. 全部相等则返回 0。
      - 复杂度：O(max(m,n)) 时间，O(m+n) 空间。
      - 注意坑：不能用字符串直接比（'10' < '2' 字典序错）；不能简单 parseFloat 整个串（会丢小数段信息）。
    followups:
      - 带字母的语义化版本怎么比？
      - 如果版本号段可能极大怎么办？
      - semver 中 `^` 和 `~` 的区别？
  - id: '02.8'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 实现快速排序，并分析时间复杂度。
    focus: 选一个基准（pivot），把小于 pivot 的放左、大于的放右，再对左右两段递归排序。
    answer:
      - 平均时间 O(n log n)，最坏 O(n²)（数组已有序且 pivot 取端点）。
      - 空间 O(log n)（递归栈），原地版本可做到 O(1) 额外空间。
      - 不稳定排序。
    followups:
      - 快排最坏情况是什么？如何避免？
      - 快排是稳定排序吗？为什么？
      - 原地快排（in-place）怎么写？为什么要用双指针交换？
  - id: '02.9'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 反转一个单链表（迭代与递归两种写法）。
    focus: 链表反转的迭代与递归两种实现思路
    answer:
      - 反转链表是链表题的母题。
      - 迭代法（推荐）：维护三个指针 prev、curr、next。每一步：先存 next = curr.next，再把 curr.next 指向 prev，然后 prev、curr 整体后移一位。循环到 curr 为 null，此时 prev 就是新头。
      - 递归法：`reverse(head)` 返回翻转后的新头。先把 head.next 之后的部分翻转，得到 newHead；此时 head.next 仍是翻转后链表的尾节点，令 head.next.next = head 把 head 接到尾部，再断开 head.next = null 防止环。
      - 复杂度：迭代 O(n) 时间 O(1) 空间；递归 O(n) 时间 O(n) 空间（栈）。
    followups:
      - 如何只翻转链表中 [m, n] 区间的节点？
      - K 个一组翻转链表怎么做？
      - 判断反转后链表是否正确。
  - id: '02.10'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 判断链表中是否有环。如果有，能否找到环的入口节点？
    focus: 判断有环：快慢指针（Floyd 判圈），快指针每次走 2 步、慢指针每次走 1 步，相遇即有环。找入口：相遇后让一个指针回到头，两者同速再走，再次相遇点就是入口。
    answer:
      - '**Floyd 判圈算法（龟兔赛跑）**：'
      - 1. 快指针 fast 每次走 2 步，慢指针 slow 每次走 1 步。若无环，fast 先到 null；若有环，fast 终会追上 slow（在环内每轮拉近 1 步，必然相遇）。
    followups:
      - 为什么快慢指针一定能相遇，不会跳过？
      - 用 Set 记录访问过的节点也能判环，空间复杂度是多少？（O(n)）
      - 如果要求出环的长度怎么做？
  - id: '02.11'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 给定一个只包含 `(`、`)`、`{`、`}`、`[`、`]` 的字符串，判断括号是否合法匹配。
    focus: 用栈：遇左括号入栈，遇右括号看栈顶是否是对应的左括号，匹配则出栈，最后栈空即合法。
    answer:
      - 经典栈应用。思路：
      - 1. 遍历每个字符。
      - 2. 是左括号 → 压栈。
      - 3. 是右括号 → 若栈空或栈顶不是其对应的左括号，则非法；否则弹栈。
      - 4. 遍历完，栈空说明全部配对成功，合法。
      - 用哈希表存「右括号 → 左括号」的映射，方便查对应关系。
      - 复杂度：时间 O(n)，空间 O(n)（最坏全左括号）。
    followups:
      - 如果要返回最长合法括号子串长度怎么做？
      - 只用 O(1) 空间判断只有 `(` `)` 的字符串是否合法怎么做？
      - 如何生成所有合法的 n 对括号组合？
  - id: '02.12'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 在未排序数组中找到第 K 大的元素。
    focus: 两种主流解法：①小顶堆维护 size=K，堆顶即第 K 大；②快速选择（quickSelect），平均 O(n)。
    answer:
      - '**方法一：小顶堆**。维护一个大小为 K 的最小堆，遍历数组：元素数 < K 直接入堆；否则若当前值 > 堆顶，弹出堆顶再入。遍历完后堆顶就是第 K 大。时间 O(n log K)，空间 O(K)。适合 K 很小或数据流场景。'
    followups:
      - 数据流场景下如何动态维护第 K 大？
      - 快速选择为什么平均 O(n)？
      - 海量数据求 TopK 怎么做？
  - id: '02.13'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 给定股票每日价格，只能买卖一次，求最大利润（买卖股票的最佳时机）。
    focus: 遍历过程中维护「历史最低价」minPrice，每天算「当天卖出能赚多少 = price - minPrice」，取最大值。
    answer:
      - 维护两个变量：minPrice（到当前为止的最低价）、maxProfit（最大利润）。
      - 遍历每天价格：先更新 maxProfit = max(maxProfit, price - minPrice)，再更新 minPrice = min(minPrice, price)。
      - 一趟 O(n)，空间 O(1)。
      - 122 多次交易：贪心，所有上涨段都吃。
      - 123/188 限次数：状态机 DP（持有/不持有 + 已交易次数）。
      - 309 含冷冻期：多一个冷冻状态。
    followups:
      - 允许多次买卖（122）怎么做？为什么贪心是对的？
      - 最多允许 k 次交易（188）状态怎么设计？
      - 含冷冻期 / 手续费怎么改状态转移？
  - id: '02.14'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 实现对象的深度优先遍历（DFS）与广度优先遍历（BFS）。
    focus: DFS 用递归（或栈）一路向下钻；BFS 用队列一层一层扫。两者都需 visited 集合防环。
    answer:
      - 前端常考「对象/树」的遍历（区别于图，但写法类似）。
      - '**DFS（深度优先）**：递归最自然——先处理当前节点，再依次递归所有子节点。也可用栈迭代。适合「找最深路径」「树形菜单折叠」。'
      - '**BFS（广度优先）**：用队列，先进先出。当前层所有节点处理完才进下一层。适合「最短路径」「按层输出」「找最近的目标」。'
      - '**防环**：对象可能有循环引用（如 a.b = a），需用 Set 记录已访问对象，避免死循环。WeakSet 更合适（不阻止 GC）。'
      - 复杂度：均 O(V+E)。
      - '**示例:**'
      - '```javascript'
      - const tree = {
      - '  name: ''root'','
      - '  children: ['
      - '    { name: ''A'', children: [{ name: ''A1'' }, { name: ''A2'' }] },'
      - '    { name: ''B'', children: [{ name: ''B1'' }] }'
      - '  ]'
      - '};'
      - // DFS（递归）
      - function dfs(node, out = []) {
      - '  if (!node) return out;'
      - '  out.push(node.name);'
      - '  (node.children || []).forEach(c => dfs(c, out));'
      - '  return out;'
      - '}'
      - console.log(dfs(tree)); // ['root','A','A1','A2','B','B1']
      - // DFS（迭代，用栈）
      - function dfsIter(root) {
      - '  const out = [], stack = [root];'
      - '  while (stack.length) {'
      - '    const node = stack.pop();'
      - '    out.push(node.name);'
      - '    // 倒序入栈保证从左到右访问'
      - '    (node.children || []).reverse().forEach(c => stack.push(c));'
      - '  }'
      - '  return out;'
      - '}'
      - // BFS（队列）
      - function bfs(root) {
      - '  const out = [], queue = [root];'
      - '  while (queue.length) {'
      - '    const node = queue.shift();'
      - '    out.push(node.name);'
      - '    (node.children || []).forEach(c => queue.push(c));'
      - '  }'
      - '  return out;'
      - '}'
      - console.log(bfs(tree)); // ['root','A','B','A1','A2','B1']
      - '```'
    followups:
      - 如何检测对象的循环引用？
      - 深拷贝时如何用 DFS 处理循环引用？
      - 二叉树的 DFS 三种序怎么区分？
  - id: '02.15'
    difficulty: 中
    tags:
      - 手写
    title: 用两个队列实现一个栈，支持 push / pop / top 操作。
    focus: 两种实现：①push 时把新元素加到空队列 q2，再把 q1 全部倒进 q2，交换 q1/q2（保证 q1 队首始终是栈顶）；②pop 时把 q1 前 n-1 个倒进 q2，剩最后一个弹出。
    answer:
      - push：把元素入 q2；把 q1 的全部元素依次出队再入 q2（这样新元素在队首）；最后交换 q1、q2。
      - pop：直接 q1 出队。
      - top：q1 队首。
      - push：直接入 q1。
      - pop：把 q1 前 n-1 个元素依次搬到 q2，剩最后一个出队作为返回值，再交换 q1、q2。
      - '**示例:**'
      - '```javascript'
      - class MyStack {
      - '  constructor() {'
      - '    this.q1 = [];'
      - '    this.q2 = [];'
      - '  }'
      - '  // 方案 A：push 时调整，保证 q1 队首是栈顶'
      - '  push(x) {'
      - '    this.q2.push(x);'
      - '    while (this.q1.length) this.q2.push(this.q1.shift());'
      - '    [this.q1, this.q2] = [this.q2, this.q1]; // 交换'
      - '  }'
      - '  pop() {'
      - '    return this.q1.length ? this.q1.shift() : undefined;'
      - '  }'
      - '  top() {'
      - '    return this.q1[0];'
      - '  }'
      - '  empty() {'
      - '    return this.q1.length === 0;'
      - '  }'
      - '}'
      - const s = new MyStack();
      - s.push(1); s.push(2); s.push(3);
      - console.log(s.top());  // 3
      - console.log(s.pop());  // 3
      - console.log(s.pop());  // 2
      - console.log(s.pop());  // 1
      - console.log(s.empty());// true
      - '```'
    followups:
      - 反过来，用两个栈实现队列怎么做？
      - 方案 A 和方案 B 的均摊复杂度哪个更优？
      - 能否用单个队列实现栈？
  - id: '02.16'
    difficulty: 高
    tags:
      - 高频
      - 手写
    title: 归并排序和快速排序有什么区别？
    focus: 归并排序是「自顶向下分两半 → 递归排序 → 合并两个有序数组」，稳定且始终 O(n log n)，但需要 O(n) 额外空间。
    answer:
      - 时间 O(n log n)（最佳/平均/最坏都是），分 log n 层，每层合并 O(n)。
      - 空间 O(n)（合并时用的辅助数组）。
      - 稳定排序（合并时相等元素取左边在前）。
    followups:
      - 为什么归并排序是稳定的，而快排不是？
      - 归并排序在链表上为什么比快排更合适？ 额外空间）
      - 迭代版（自底向上）的归并排序怎么实现？避免了递归栈开销。
  - id: '02.17'
    difficulty: 高
    tags:
      - 高频
      - 手写
    title: 给定 n 个非负整数表示柱子的高度图，计算按此排列能接多少雨水。
    focus: 每个位置能接的水 = min(左边最高, 右边最高) - 当前高度。可用动态规划预处理左右最大值，或用左右双指针 O(1) 空间。
    answer:
      - '**核心公式**：位置 i 能接的雨水 = max(0, min(leftMax[i], rightMax[i]) - height[i])。'
    followups:
      - 如果柱子是二维的（盛水容器为 3D），怎么做？
      - 单调栈解法怎么写？
      - 「盛最多水的容器」 和接雨水有什么区别？
  - id: '02.18'
    difficulty: 高
    tags:
      - 高频
      - 手写
    title: 给定不同面额的硬币 coins 和总金额 amount，求凑成总金额所需的最少硬币数。每种硬币可使用无限次。
    focus: 完全背包 DP：dp[i] 表示金额 i 的最少硬币数，dp[i] = min(dp[i], dp[i-coin]+1)，遍历所有 coin。
    answer:
      - 状态：dp[i] 表示凑出金额 i 所需的最少硬币数。
      - 转移：对每个硬币 coin，dp[i] = min(dp[i], dp[i - coin] + 1)（前提 i >= coin）。
      - 初始化：dp[0] = 0，其余设为 Infinity。
      - 答案：dp[amount]，若仍为 Infinity 返回 -1。
    followups:
      - 求组合方案数（而非最少硬币数）怎么改 DP？
      - 贪心（每次取最大面额）为什么不一定对？
      - 如果每种硬币只能用一次呢？
