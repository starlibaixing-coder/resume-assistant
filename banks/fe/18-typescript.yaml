questions:
  - id: "18.129"
    difficulty: 中
    tags: [高频, 概念]
    title: TypeScript 是怎么编译成 JavaScript 的？用 babel 处理 TS 和用 tsc 有什么区别？
    focus: "TS 编译本质是「类型擦除」——把类型注解去掉，剩下的就是 JS。tsc（TS 编译器）既做类型检查又做转译；babel 只做转译（@babel/preset-typescript 擦除类型），不做类型检查，要靠编辑器或单独跑 tsc --noEmit 检查。现代项目多 babel/swc 转译 + tsc 类型检查。"
    answer:
    - TS = JS + 类型注解。
    - "编译时，类型注解（如 `: string`、`interface`、`type`）被全部移除，剩下的就是合法 JS。"
    - 运行时没有任何类型信息（这正是 TS 是「编译时类型」的原因）。
    followups:
    - 为什么 babel 不做类型检查？这样设计有什么好处？
    - TS 的 enum 编译后是什么？
    - 怎么在运行时保留类型信息？
  - id: "18.130"
    difficulty: 高
    tags: [高频, 概念]
    title: "TypeScript 的 `Record<K, T>` 是怎么实现的？"
    focus: TypeScript Record 类型的实现原理
    answer:
    - "`K extends keyof any`：K 必须是合法的键类型（string | number | symbol）。"
    - "`{ [P in K]: T }`：映射类型，遍历 K 的每个键 P，定义为 T 类型。"
    - "例子：`Record<'a'|'b', number>` = `{ a: number; b: number }`。"
    followups:
    - Pick/Omit/Partial/Required 这些工具类型分别怎么实现？
    - "映射类型 `[P in K]` 和索引签名 `[key: string]` 有什么区别？"
  - id: "18.131"
    difficulty: 高
    tags: [概念]
    title: TypeScript 的泛型和条件类型（Conditional Types）怎么用？举几个实际场景。
    focus: "泛型是「类型的参数」——让类型可复用、可推导（function identity<T>(x:T):T）。条件类型是「类型层面的 if-else」——`T extends U ? X : Y`，根据类型关系选不同类型。两者结合能写出强大的工具类型（Awaited/ReturnType/Exclude/Extract）。"
    answer:
    - 类型的参数，让函数/接口/类能适用于多种类型，且保持类型关联。
    - "例子：`function identity<T>(x: T): T` —— 传什么类型返回什么类型，T 关联输入输出。"
    - "常见场景：数组 `Array<T>`、Promise `Promise<T>`、API 请求返回值 `request<T>(): Promise<T>`。"
    followups:
    - infer 关键字具体怎么用？什么场景？
    - 映射类型 + 条件类型能实现什么？
    - 泛型约束（extends）怎么限制泛型范围？
