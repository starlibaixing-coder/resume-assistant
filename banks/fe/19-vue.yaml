questions:
  - id: "19.132"
    difficulty: 中
    tags: [高频, 概念]
    title: Vue 的响应式原理是什么？Vue 2（defineProperty）和 Vue 3（Proxy）有什么区别？
    focus: Vue 响应式靠「数据劫持 + 依赖收集 + 派发更新」：读数据时收集谁依赖它，改数据时通知这些依赖更新。Vue2 用 defineProperty 逐属性劫持（需递归、监听不了数组/新增属性）；Vue3 用 Proxy 代理整个对象（一次性、能监听增删、数组、性能更好）。
    answer:
    - "**响应式三步走**："
    - "1. **数据劫持**：拦截对数据的读写。"
    - "2. **依赖收集（读时）**：组件 render 时访问了哪些数据，把这些数据→组件的依赖关系记下来。"
    - "3. **派发更新（写时）**：数据被修改时，通知所有依赖它的组件重新渲染。"
    followups:
    - Vue3 的 ref 和 reactive 有什么区别？为什么要两个？
    - Proxy 能监听不了什么？
    - Vue 的依赖收集和 MobX 的有什么异同？
  - id: "19.133"
    difficulty: 中
    tags: [概念]
    title: Vue 的虚拟 DOM 和编译优化是什么？Vue 3 的编译时优化比 Vue 2 强在哪？
    focus: Vue 虚拟 DOM 与编译时优化的原理
    answer:
    - "**虚拟 DOM 流程**："
    - 1. 数据变 → 重新渲染生成新的虚拟 DOM 树（vnode）。
    - 2. 新旧 vnode 对比（diff）→ 找出差异。
    - 3. 只把差异部分更新到真实 DOM。
    followups:
    - Vue3 的 Block tree 是怎么收集动态节点的？
    - 为什么 React 不做编译时优化？
    - 虚拟 DOM 一定比直接操作 DOM 快吗？什么情况反而慢？
  - id: "19.134"
    difficulty: 高
    tags: [高频, 概念]
    title: Vue 和 React 的核心区别是什么？从响应式机制、数据流、设计理念对比。
    focus: Vue 与 React 在响应式机制和设计理念上的差异
    answer:
    - "**核心区别对比**："
    - "| 维度 | Vue | React |"
    - "|---|---|---|"
    - "| 响应式 | 数据变→自动精确更新（Proxy 追踪） | setState→组件重渲染（不可变） |"
    - "| 数据修改 | 可变（直接赋值，响应式系统追踪） | 不可变（必须新对象触发更新） |"
    - "| 视图描述 | 模板（编译时优化） | JSX（运行时，更灵活） |"
    - "| 组件更新 | 精确到属性（响应式追踪） | 整组件重渲染（靠 memo/selector 优化） |"
    - "| 数据流 | 双向绑定（v-model，语法糖） | 单向（onChange + setState） |"
    - "| 学习曲线 | 低（约定优于配置） | 中（更底层、概念少但灵活） |"
    followups:
    - Vue 的双向绑定（v-model）和 React 受控组件本质上一样吗？
    - 为什么 Vue 用模板而 React 用 JSX？各有什么取舍？
    - Composition API 是不是在学 React Hooks？有什么不同？
  - id: "19.135"
    difficulty: 高
    tags: [高频, 概念]
    title: Vue 3 的 Composition API 相比 Options API 解决了什么问题？
    focus: Composition API 解决了 Options API 的什么问题
    answer:
    - "**Options API 的痛点**："
    - 同一个功能（如「搜索」）的逻辑被拆散：状态在 data、方法在 methods、计算在 computed、监听在 watch。功能一多，代码在不同选项间跳来跳去，难维护、难复用。
    followups:
    - Vue 的 ref 为什么需要 .value？有没有不用写 .value 的方案？
    - Composition API 完全替代 Options API 了吗？老项目要迁移吗？
