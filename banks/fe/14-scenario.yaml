module: 14
moduleName: 场景题
questions:
  - id: '14.117'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 实现一个并发请求控制器（limitConcurrency）：给定一组异步任务和最大并发数，控制同时最多只有 N 个在执行。
    focus: 核心思路：维护一个「正在执行的 Set」和「等待队列」。有任务要执行时，若正在执行数 < 上限就放进去跑，否则入队等待；每个任务完成后从 Set 移除，并从队列取下一个执行。
    answer:
      - '**并发控制要解决的问题**：一次性发起几百个请求会把浏览器/服务器打垮（浏览器同域并发限制、服务器限流）。需要限制同时只跑 N 个，跑完一个再放下一个。'
    followups:
      - 如果要支持任务优先级怎么做？
      - 任务失败后要不要重试？怎么实现重试？
      - Promise 池还做了哪些优化？
  - id: '14.118'
    difficulty: 中
    tags:
      - 手写
    title: 实现一个模板字符串编译器：把模板里的插值（如 user.name）替换成真实数据。例如 Hello, {{user.name}}! 和 {user:{name:'Alice'}} → Hello, Alice!
    focus: 核心思路：用正则匹配出所有 {{...}} 占位符，对每个占位符，按点号分割路径（user.name → [user, name]），从数据对象里逐层取值，最后替换占位符。
    answer:
      - 按 . 分割成路径数组（user.name → ['user', 'name']）。
      - 从 data 对象逐层取值：data['user']['name']。
    followups:
      - 怎么支持 {{#each list}} 循环语法？
      - 取值时遇到函数要不要执行？
      - Vue 的模板编译比这个复杂在哪？
  - id: '14.119'
    difficulty: 高
    tags:
      - 手写
    title: 实现一个 sum 函数，支持链式调用：sum(1,2).sumOf() 返回 3；sum(1,2)(3).sumOf() 返回 6；sum(1)(2,3,4).sumOf() 返回 10。
    focus: 核心：sum 返回一个函数（支持继续调用），这个函数内部累加所有参数，并挂一个 sumOf 方法返回总和。关键点：函数也是对象，可以挂属性；用闭包保存累加值；函数 toString/valueOf 可让隐式转换时也能返回值。
    answer:
      - '**解题关键**：'
      - 1. sum 要返回一个**函数**（这样才能 sum(1,2)(3) 链式调用）。
      - 2. 这个函数每次被调用，把新参数累加进闭包变量 total。
      - 3. 这个函数要挂一个 sumOf 方法，调用时返回 total。
      - 4. 闭包：用一个外部变量（或函数属性）累加所有调用传入的值。
    followups:
      - 怎么让 sum + 0 也能等于 3？
      - 这种链式调用和 Promise 的链式有什么本质区别？
      - 怎么限制最多调用 N 次？
  - id: '14.120'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: 如何实现 token 的无感刷新（过期时自动续期，用户无感知）？token 怎么安全存储？
    focus: 双 token 方案：短期的 access token（用于请求）+ 长期的 refresh token（用于续期）。请求遇 401（过期）时，用 refresh token 换新 access token，重发失败的请求，用户全程无感。存储：access token 放内存（短期），refresh token 放 HttpOnly cookie（安全），不要放 localStorage（XSS 能偷）。
    answer:
      - 拦截这个 401，暂停后续请求。
      - 用 refresh token 调刷新接口，拿新的 access token。
      - 用新 token 重发刚才失败的请求。
      - 用户全程无感知。
    followups:
      - 多个请求同时 401 怎么保证只刷新一次？
      - refresh token 放 cookie，怎么防 CSRF？
      - token 续期失败怎么处理？
  - id: '14.121'
    difficulty: 高
    tags:
      - 高频
    title: 移动端弱网环境下，如何保证首屏渲染速度在 1 秒内？
    focus: 弱网核心瓶颈是资源传输慢，策略：①减少首屏要传的数据量（代码分割、按需加载、SSR/骨架屏）②提前加载关键资源（preload/preconnect）③缓存最大化（强缓存/Service Worker）④传输优化（gzip/brotli、HTTP2、图片优化）。目标是首屏只加载最少必要内容。
    answer:
      - '**代码分割**：首屏只加载首屏路由的代码，其他路由懒加载。'
      - '**Tree shaking**：删掉没用到的代码。'
      - '**首屏数据精简**：首屏接口只返回必要字段，别一次返回一大坨。'
      - '**SSR/预渲染**：服务端渲染好 HTML 直接给，不用等 JS 下载执行再渲染。弱网下 SSR 优势巨大。'
      - '**骨架屏**：先显示骨架，给用户「正在加载」的感知，降低白屏焦虑。'
      - '**preload/prefetch**：preload 关键资源（字体、首屏 CSS）提前加载；dns-prefetch/preconnect 提前建连。'
      - '**HTTP2**：多路复用，减少连接数。'
      - '**CDN**：资源离用户近。'
      - gzip/brotli 压缩文本。
      - 图片：WebP/AVIF、响应式图片（srcset）、懒加载非首屏图片。
      - 强缓存（Cache-Control）+ 协商缓存（ETag）。
      - Service Worker 离线缓存——弱网甚至无网都能秒开。
      - 关键 CSS 内联（首屏样式直接写在 HTML，不额外请求）。
      - 非关键 CSS/JS 延迟加载。
      - '**示例:**'
      - 优化组合拳：SSR 直出首屏 HTML + 关键 CSS 内联 + 非首屏路由懒加载 + Service Worker 缓存 + 图片 WebP+懒加载 + HTTP2+CDN。弱网下首屏只需传输最小 HTML+关键 CSS，1 秒内可渲染出内容；JS 异步加载后续增强交互。
    followups:
      - SSR 在弱网下一定比 CSR 快吗？什么情况反而慢？
      - Service Worker 缓存更新策略怎么设计？
      - 骨架屏和首屏内容不一致会闪，怎么处理？
  - id: '14.122'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: 一个大型列表（上千条），如何避免某一项数据变化导致整个列表重新渲染？
    focus: 核心是「精确更新」：①每项用稳定唯一 key 让框架只更新变化的项 ②把每项拆成独立子组件 + memo，props 没变就不重渲染 ③用 selector/响应式精准订阅，只有变化那一项的组件订阅对应数据 ④虚拟列表只渲染可视区。目标是「数据变 A，只有 A 对应的组件更新」。
    answer:
      - '**问题本质**：React/Vue 默认父组件重渲染会带着所有子组件重渲染。一个大列表，改一项，整个列表重渲染，卡。'
    followups:
      - memo 的浅比较在嵌套对象时会失效，怎么办？
      - Redux 的 useSelector 怎么实现精准订阅？
      - 虚拟列表 + memo，性能还能再优化吗？
