    title: React 列表渲染时 `key` 的作用是什么？默认行为是什么？
    focus: React 列表 key 的作用与默认行为的影响
    answer:
      - '**key 的作用**：在 reconcile 阶段，React 对比新旧 children 列表时，靠 key 把新列表的元素和旧列表的元素对应起来。有 key 才能判断「A 元素从位置 3 移到了位置 0」，于是只移动 DOM 节点而不是销毁重建。'
    followups:
