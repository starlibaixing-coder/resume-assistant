  - id: '13.108'
    difficulty: 高
    tags:
      - 高频
      - 手写
    title: React 中异步请求的竞态条件（Race Condition）是什么？
    focus: 竞态条件：先发的慢请求后返回，覆盖了后发的快请求结果，UI 显示「过时」数据。
    answer:
      - '**什么是竞态**：用户快速切换 id（1→2→3），三次请求发出。若请求 1 最慢，最后返回，它的结果会覆盖最新的请求 3 的结果，UI 显示了 id=1 的数据，但当前页是 id=3——数据错乱。'
    followups:
      - useEffect 的 cleanup 执行时机是什么？
