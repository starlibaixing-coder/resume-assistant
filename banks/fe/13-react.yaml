    title: 请手写一个简化版的 `useState`。
    focus: useState 的底层实现思路
    answer:
      - '**简化版实现要点**：'
      - 1. 用一个模块级变量 `state`（或链表节点）+ `index` 指针。
      - 2. useState 首次调用初始化 state，后续调用读已有值，然后 index++。
      - 3. setState 把新值/更新函数记下来，标记组件需要重渲染。
      - 4. 重渲染时 index 归零，重新按顺序读。
    followups:
