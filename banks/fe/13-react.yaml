  - id: '13.105'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: React 的 diff 算法是怎么工作的？
    focus: React diff 基于**三个假设**把树对比从 O(n³) 降到 O(n)：①同层 diff（跨层级移动直接丢弃重建）；②同类型才 diff（不同类型直接替换整棵子树）；③靠 `key` 标识同层列表元素。
    answer:
      - '**为什么需要 diff**：状态变化后 React 拿到新 VDOM，要和旧 VDOM 对比，找出最小变更再去更新真实 DOM。朴素对比两棵树是 O(n³)，工程不可用。'
    followups:
      - 用 index 做 key 会出什么问题？什么时候用 index 做 key 反而 OK？
      - 为什么跨层级移动不复用？
      - Vue 的 diff 和 React 的 diff 有何区别？
  - id: '13.106'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: 什么是 React 的合成事件（SyntheticEvent）？为什么不直接用原生事件？
    focus: 合成事件是 React 对浏览器原生事件的**跨浏览器封装**，提供统一 API 和属性。React 不在 DOM 节点上直接绑定事件，而是在根容器上挂一个**统一的事件委托监听器**，事件冒泡到根时再按映射找到对应组件的回调执行——省内存、性能好、能统一兼容处理。
    answer:
      - '**为什么不直接用原生事件**：'
      - 1. **浏览器兼容性**：IE 和 Chrome 事件对象差异大（`e.target` vs `e.srcElement`、阻止默认行为 API 不同），合成事件抹平这些差异。
      - 2. **性能（事件委托）**：原生事件每个元素每个事件都要 addEventListener 一个监听器，列表 1000 项就有 1000 个监听器，内存大。React 只在根上挂一个，通过事件委托统一处理。
      - 3. **统一的事件流控制**：React 能在合成事件层实现自己的「事件优先级」（discrete/continuous）、与 fiber 调度整合、批处理 setState。
      - 4. **更安全**：合成事件对象是池化的（React 16 及以前），避免每次创建对象的开销（React 17 移除了事件池）。
    followups:
      - React 16 的合成事件对象池是什么？为什么 17 移除了？
      - 原生事件里的 setState 和合成事件里的 setState 有什么区别？
      - 如果想阻止合成事件冒泡到原生 document，怎么做？
