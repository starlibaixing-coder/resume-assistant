    title: 在 React Router 中如何实现页面切换动画？
    focus: 用 `react-transition-group` 的 `<CSSTransition>` 或 framer-motion 的 `<AnimatePresence>`，关键是把路由的 `location.key`/`location.pathname` 作为列表项 key，让旧组件退场、新组件进场。
    answer:
      - '**核心难点**：路由切换时，旧组件直接卸载、新组件直接挂载，默认没有过渡。要做动画，必须让「旧组件还能存活一小段时间执行退场动画」。'
    followups:
