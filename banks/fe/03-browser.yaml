  - id: '03.33'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: JavaScript 的垃圾回收机制是怎样的？
    focus: JS 栈由执行上下文进出自动回收（ESP 指针下移即销毁）；堆靠 GC。判断可达性：从根（全局对象、当前栈上的变量）出发遍历，能到达的对象存活，到达不了的就是垃圾，靠「标记-清除」算法回收。GC 在代码执行间隙分批进行，避免长时间卡顿。
    answer:
      - '**栈**：基本类型、引用地址。函数执行完，上下文出栈，ESP（栈顶指针）下移，该空间自动「失效」（被后续覆盖）。**没有显式 GC**。'
      - '**堆**：对象、闭包变量。靠**垃圾回收器**识别「不可达」对象并释放。'
    followups:
      - WeakMap/WeakSet 为什么不会阻止 GC？
      - 如何排查页面内存泄漏？
  - id: '03.34'
    difficulty: 高
    tags:
