    title: 什么是「闭包（Closure）」？
    focus: 闭包是函数与其词法环境（外层作用域）的组合——内部函数引用了外部函数的变量，就形成了闭包；本质是作用域链的延伸。
    answer:
      - '**闭包的定义**：函数与其词法环境（外层作用域）的组合。当一个内部函数引用了外部函数的变量，就形成了闭包。'
    followups:
