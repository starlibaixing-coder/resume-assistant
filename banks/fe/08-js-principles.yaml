questions:
  - id: '08.62'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: JavaScript 中 `this` 的指向规则是什么？
    focus: JavaScript this 指向的判定规则与优先级
    answer:
      - '**`this` 指向规则**（按优先级从低到高）：'
      - 1. **默认绑定**：独立函数调用，非严格模式 `this` 是 window/global，严格模式是 undefined。
      - 2. **隐式绑定**：`obj.fn()`，`this` 指向 obj（谁调用指向谁）。注意隐式丢失：`var bar = obj.fn; bar()` 会丢成默认绑定。
      - 3. **显式绑定**：`fn.call(obj)` / `fn.apply(obj)`，强行指定 this（见追问1）。
      - 4. **new 绑定**：`new fn()`，this 指向新创建的对象（优先级最高之一）。
      - 5. **箭头函数**：**没有自己的 this**，继承定义时外层的 this（静态，不可被 call/apply/bind 改变）。
    followups:
      - 箭头函数能用 call 改变 this 吗？为什么？
      - bind 之后再用 new 调用，this 指向谁？
  - id: '08.63'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: 什么是防抖（debounce）？它解决什么问题？
    focus: 防抖：事件频繁触发时，只在「最后一次触发后等一段时间」才执行——连续触发期间一直不执行。核心是「每次触发都清掉上一次的定时器，重新计时」。
    answer:
      - '**解决什么问题**：高频事件（input、resize、按钮连点）每秒触发几十上百次，直接执行会导致频繁请求/DOM 操作，卡顿。'
    followups:
      - 防抖要不要支持「立即执行」版本？怎么实现？
      - 节流（throttle）和防抖的区别是什么？
  - id: '08.64'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: 请手写一个节流函数（throttle）。
    focus: 节流：固定时间间隔只执行一次，期间无视后续触发——匀速执行。和防抖（只执行最后一次）相反，节流保证「按固定节奏」执行。
    answer:
      - '**节流策略**：**保证固定节奏**。第一次触发立即执行，之后进入冷却期；冷却期内无视所有后续触发，冷却结束才允许下一次执行。'
    followups:
      - 节流的时间戳版和定时器版各有什么短板？
      - 怎么写一个「首尾都执行」的节流？
      - 防抖和节流怎么选？
      - requestAnimationFrame 和节流什么关系？
  - id: '08.65'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: '`Promise.all`、`Promise.race`、`Promise.allSettled`、`Promise.any` 这四个组合方法各自的行为和适用场景是什么？'
    focus: 按「等不等全部完成 / 取成功还是失败」分：all 要全部成功，any 要一个成功，race 取最快不管成败，allSettled 等全部完成不管成败。
    answer:
      - '**四个方法的本质差异**（一张表记住）：'
      - '| 方法 | 成功条件 | 失败行为 | 适用场景 |'
      - '|---|---|---|---|'
      - '| `Promise.all` | **全部**成功 | 任一失败→整体失败（短路） | 多个请求都要成功才继续 |'
      - '| `Promise.any` | **任一**成功 | 全失败→整体失败 | 取最快的一个成功响应 |'
      - '| `Promise.race` | 第一个完成（**不论成败**） | 第一个若是失败→失败 | 超时控制、取最快响应 |'
      - '| `Promise.allSettled` | **全部完成**（不论成败） | 永不 reject，返回状态数组 | 批量执行后统一汇总结果 |'
    followups:
      - 如何手写 Promise.all？遇到非 Promise 值怎么处理？
      - 如何手写 Promise.race？
      - Promise.all 中一个失败后，其他还在 pending 的 Promise 会取消吗？
      - 为什么没有 `Promise.none` 或 `Promise.first`？实际怎么模拟？
  - id: '08.66'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: 什么是 JavaScript 的作用域和作用域链？
    focus: 作用域是变量/函数的可访问范围（JS 用词法作用域，由代码书写位置决定）；作用域链是当前作用域→外层作用域→...→全局的层层查找路径；变量查找时从内层作用域开始，沿作用域链向外逐层找，找到即停，找不到报 ReferenceError；本质由执行上下文的变量对象（VO/AO）链构成。
    answer:
      - '**作用域（Scope）**：变量和函数的可访问范围。JS 是**词法作用域（静态作用域）**——作用域由代码书写位置决定，而非调用位置。'
    followups:
      - 词法作用域和动态作用域的区别？this 是哪种？
      - let/const 的块级作用域和 var 的函数作用域有什么本质区别？
      - 作用域链和原型链有什么区别？
      - 闭包是怎么利用作用域链的？
  - id: '08.67'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: ES6 的 `class` 和传统构造函数+原型有什么区别？
    focus: ES6 class 与构造函数+原型的异同
    answer:
      - '**class vs 传统模式的核心区别**：'
      - '| 特性 | 传统构造函数 | ES6 class |'
      - '|---|---|---|'
      - '| 调用方式 | 可不用 new（结果异常） | **必须 new**，否则报错 |'
      - '| 方法定义 | `Person.prototype.say` | `say() {}` 写在 class 内 |'
      - '| 可枚举性 | 方法可枚举 | **方法默认不可枚举** |'
      - '| 继承 | 原型链/借用构造函数/组合 | `extends` + `super` |'
      - '| 静态方法 | `Person.static` | `static method()` |'
      - '| 语法 | 松散 | 集中、清晰 |'
    followups:
      - class 的 `super()` 为什么必须在 constructor 第一行？
      - class 的静态方法和实例方法在原型链上分别在哪？
      - class 能实现多继承吗？mix-in 怎么做？
      - 私有属性 `#field` 和传统闭包私有化比，有什么优势？
  - id: '08.68'
    difficulty: 中
    tags:
      - 高频
      - 概念
    title: 箭头函数和普通函数有哪些区别？为什么箭头函数不能用作构造函数或方法？
    focus: 箭头函数与普通函数的核心区别及限制
    answer:
      - 普通函数：this 由调用方式决定（谁调用指向谁，参见 fe-js-001）。
      - 箭头函数：**继承外层词法作用域的 this**（定义时确定，不可变）。
      - 普通函数：有 arguments（类数组，存所有参数）。
      - 箭头函数：没有 arguments，用剩余参数 `(...args) =>` 替代。
      - 箭头函数没有 `prototype` 属性。
      - '`new` 会报错：`TypeError: X is not a constructor`。'
      - 箭头函数体内不能用 `yield`。
      - 没有 `new.target`。
      - 没有 `super`（虽然能在对象方法里用，但绑定外层）。
      - 不能用 `call`/`apply`/`bind` 改变 this（this 是词法绑定的）。
      - 砍掉自己的 this，继承外层——回调里能直接用外层 this。
      - 砍掉 prototype、arguments 等——更纯粹，适合纯函数。
      - '**示例:**'
      - '**回调里 this 问题**：'
      - '```javascript'
      - class Counter {
      - '  count = 0;'
      - '  // 普通函数回调(this丢失)'
      - '  startBad() {'
      - '    setInterval(function() {'
      - '      this.count++;  // this指向window,报错或无效'
      - '    }, 1000);'
      - '  }'
      - '  // 箭头函数回调(继承this)'
      - '  startGood() {'
      - '    setInterval(() => {'
      - '      this.count++;  // 继承startGood的this(指向实例)'
      - '    }, 1000);'
      - '  }'
      - '}'
      - '```'
      - '**箭头函数不能 new**：'
      - '```javascript'
      - const Foo = () => {};
      - 'new Foo(); // TypeError: Foo is not a constructor'
      - Foo.prototype; // undefined
      - '```'
    followups:
      - 箭头函数的 this 能用 call/apply/bind 改变吗？为什么？
      - 对象方法用箭头函数有什么坑？
      - React 类组件为什么用箭头函数做事件处理？函数组件呢？
      - 箭头函数和普通函数在性能上有差异吗？
  - id: '08.69'
    difficulty: 中
    tags:
      - 高频
      - 手写
    title: JavaScript 的深拷贝和浅拷贝有什么区别？
    focus: 浅拷贝只复制一层、嵌套对象仍共享引用；深拷贝递归复制所有层级、新旧完全独立，常用 JSON 序列化、structuredClone 或手写递归三种方案。
    answer:
      - 浅拷贝：只复制一层，嵌套对象仍共享引用。`Object.assign({}, obj)`、扩展运算符 `{...obj}` 都是浅拷贝。
      - 深拷贝：递归复制所有层级，新旧对象完全独立。
    followups:
