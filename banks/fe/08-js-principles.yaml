  - id: '08.74'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: JavaScript 的「迭代器（Iterator）」和「生成器（Generator）」是什么？
    focus: 迭代器是实现 next() 方法返回 {value, done} 的对象；生成器是 function* + yield 定义的函数，调用返回一个迭代器，能暂停执行。Generator 是创建迭代器的便捷方式，用于惰性求值、异步流程控制。
    answer:
      - '**迭代器（Iterator）**：'
      - 一个实现了 `next()` 方法的对象，每次调用返回 `{value, done}`：
      - '```javascript'
      - const iter = {
      - '  i: 0,'
      - '  next() {'
      - '    if (this.i < 3) return { value: this.i++, done: false };'
      - '    return { value: undefined, done: true };'
      - '  }'
      - '};'
      - iter.next(); // {value:0, done:false}
      - iter.next(); // {value:1, done:false}
      - iter.next(); // {value:2, done:false}
      - iter.next(); // {value:undefined, done:true}
      - '```'
    followups:
      - 为什么普通对象不能 for...of？怎么让它可迭代？
      - Generator 怎么做异步流程控制？
      - async/await 和 Generator 是什么关系？
      - yield* 是什么？委托生成器？
  - id: '08.75'
    difficulty: 高
    tags:
      - 高频
      - 手写
    title: 什么是「函数柯里化（Currying）」和「偏函数（Partial Application）」？
    focus: 柯里化是把多参数函数转成一连串单参数函数（f(a,b,c) → f(a)(b)(c)），参数够了才执行；偏函数是预先固定部分参数返回新函数（f(a,b,c) → f(a)→新函数等b,c）；手写 curry 核心是递归收集参数，长度够了调原函数；应用：参数复用、延迟执行、函数组合；柯里化是偏函数的极端形式（每次只传一个参数）。
    answer:
      - '**柯里化（Currying）**：'
      - 把接受多个参数的函数，变换成接受单一参数的函数链。每次传一个参数，返回新函数接收下一个，直到参数够了才执行。
      - '```javascript'
      - // 普通函数
      - function add(a, b, c) { return a + b + c; }
      - add(1, 2, 3); // 6
      - // 柯里化后
      - function curriedAdd(a) {
      - '  return function(b) {'
      - '    return function(c) {'
      - '      return a + b + c;'
      - '    };'
      - '  };'
      - '}'
      - curriedAdd(1)(2)(3); // 6
      - '```'
    followups:
      - curry 函数里的 fn.length 是什么？为什么能靠它判断参数够不够？
      - 柯里化和 async/await 的链式调用有什么本质不同？
      - 函数式编程里的 compose/pipe 和柯里化怎么配合？
      - lodash 的 _.curry 和手写的有什么增强？
  - id: '08.76'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: JavaScript 的「内存泄漏」和「内存溢出」有什么区别？
    focus: 内存泄漏是「该回收的没回收」（变量被意外引用导致 GC 无法回收，长期累积）；内存溢出是「分配时内存不够」（运行时申请超可用内存直接报错崩溃）。内存泄漏长期累积，最终可能导致内存溢出。
    answer:
      - '**内存泄漏（Memory Leak）**：程序中已不用的内存（变量/对象）因为仍被引用，垃圾回收无法回收，长期占用。累积导致可用内存越来越少。'
      - '**内存溢出（Out of Memory, OOM）**：程序运行时申请的内存超过了可用内存，直接报错崩溃。'
      - '**关系**：内存泄漏长期累积，最终可能导致内存溢出。'
    followups:
      - WeakMap/WeakSet 为什么能避免泄漏？和 Map/Set 的区别？
      - Vue/React 组件销毁时常见的泄漏有哪些？
      - 标记-清除算法具体怎么工作？相比引用计数有什么优势？
