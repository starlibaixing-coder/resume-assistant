  - id: '08.72'
    difficulty: 高
    tags:
      - 高频
      - 概念
    title: Promise 的 `.then(onFulfilled, onRejected)` 和 `.catch()` 有什么区别？为什么推荐用 `.catch`？
    focus: Promise then 第二参数与 catch 的捕获范围差异
    answer:
      - '`.then(onFulfilled, onRejected)` 的 onRejected **只捕获前一个 Promise 的 reject**，捕获不到**同个 then 里 onFulfilled 抛出的同步错误**。'
      - '`.catch()` 能捕获**它之前整条链**上的所有错误（reject + 抛出的异常），因为 `.catch()` 本质是 `.then(null, onRejected)`，挂在了链的后端。'
    followups:
      - Promise 的状态一旦改变还能再变吗？
      - async/await 里怎么捕获 reject？
      - 如果一个 Promise 链没有任何 `.catch`，未捕获的 rejection 会怎样？
      - "`.catch` 之后还能继续 `.then` 吗？catch 之后的链是什么状态？"
  - id: '08.73'
