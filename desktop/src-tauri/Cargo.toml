[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = "2"
# keyring v3 平台后端是可选 feature,不开 apple-native 则 Entry::new 报 NoStorageAccess
# (钥匙串静默失效:保存报错、读取被前端吞掉)
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
# bundled 自带 SQLite,测试时不依赖系统 libsqlite3
rusqlite = { version = "0.32", features = ["bundled"] }
